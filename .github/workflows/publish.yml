name: Publish

# Push a tag v<version> (the <Version> in the projects, e.g. v1.2.0) to publish every package here to nuget.org.
# Winche packages depend on each other through nuget.org, so release in order: Winche.Core, Winche.Secrets,
# Winche.Rules, then
# Winche.Database, Winche.Storage, Winche.Auth and Winche.Webhooks, then Winche.Assets, then Winche.Functions, then
# Winche.Cli.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # NuGet trusted publishing (OIDC): no API key is stored
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Deno (functions run on it; the tests use it)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: The tag matches the version
        run: |
          version=$(dotnet msbuild src/Winche.Functions/Winche.Functions.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in the projects ($version)."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Winche.Functions.slnx

      - name: Build
        run: dotnet build Winche.Functions.slnx -c Release --no-restore

      # Tests use PostgreSQL in Docker (Testcontainers), which GitHub's Ubuntu runners have.
      - name: Test
        run: dotnet test Winche.Functions.slnx -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Winche.Functions/Winche.Functions.csproj -c Release --no-build -o ./packages
          dotnet pack src/Winche.Functions.Database/Winche.Functions.Database.csproj -c Release --no-build -o ./packages
          dotnet pack src/Winche.Functions.Storage/Winche.Functions.Storage.csproj -c Release --no-build -o ./packages
          dotnet pack src/Winche.Functions.Auth/Winche.Functions.Auth.csproj -c Release --no-build -o ./packages
          dotnet pack src/Winche.Functions.Assets/Winche.Functions.Assets.csproj -c Release --no-build -o ./packages

      # Exchange the GitHub OIDC token for a short-lived NuGet.org API key.
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: FlameOfUdun

      - name: Push
        run: dotnet nuget push ./packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
