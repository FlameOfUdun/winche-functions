name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # NuGet trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Deno (functions run on it; tests use it)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Restore
        run: dotnet restore Winche.Functions.slnx

      - name: Build
        run: dotnet build Winche.Functions.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Winche.Functions.slnx -c Release --no-build

      - name: Pack
        run: |
          for p in Winche.Functions Winche.Functions.Database Winche.Functions.Storage Winche.Functions.Auth; do
            dotnet pack src/$p/$p.csproj -c Release --no-build -o ./packages
          done

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: FlameOfUdun

      - name: Push
        run: dotnet nuget push ./packages/*.nupkg ./packages/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
